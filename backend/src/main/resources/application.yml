spring:
  application:
    name: futurotech-legal
  servlet:
    multipart:
      # Límite por archivo y por petición para los adjuntos del caso en /generate.
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legal_engine}
    username: ${DB_USER:legal}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${API_PORT:8080}

# --- IA: proveedor de generación ---
# Pipeline multi-proveedor (todo API compatible con OpenAI). Costo cero por
# defecto: Gemini Flash (generar) + Groq/Llama (verificar citas) + DeepSeek vía
# OpenRouter (verificar datos). Cambiar de proveedor = cambiar URL + modelo + key.
ai:
  # Rol 1: redacta el documento.
  generator:
    base-url: ${AI_GENERATOR_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${GEMINI_API_KEY:}
    model: ${AI_GENERATOR_MODEL:gemini-2.5-flash}
    max-tokens: ${AI_GENERATOR_MAX_TOKENS:8000}
    timeout-seconds: ${AI_GENERATOR_TIMEOUT:120}
  # Rol 2: verifica que las normas citadas estén en los fragmentos RAG.
  verifier-citations:
    base-url: ${AI_VERIFIER_CITATIONS_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${AI_VERIFIER_CITATIONS_MODEL:llama-3.3-70b-versatile}
    max-tokens: ${AI_VERIFIER_CITATIONS_MAX_TOKENS:4000}
    timeout-seconds: ${AI_VERIFIER_CITATIONS_TIMEOUT:90}
  # Rol 3: verifica coherencia de datos duros (cálculos, fechas, montos, plazos).
  verifier-data:
    base-url: ${AI_VERIFIER_DATA_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    model: ${AI_VERIFIER_DATA_MODEL:deepseek/deepseek-chat-v3:free}
    max-tokens: ${AI_VERIFIER_DATA_MAX_TOKENS:4000}
    timeout-seconds: ${AI_VERIFIER_DATA_TIMEOUT:90}

# Verificación anti-alucinación (post-generación). Ver CitationVerificationService.
verification:
  enabled: ${VERIFICATION_ENABLED:true}
  citations-enabled: ${VERIFICATION_CITATIONS_ENABLED:true}
  data-enabled: ${VERIFICATION_DATA_ENABLED:true}

# --- Embeddings para el RAG (Gemini, 768 dims → encaja en vector(768)) ---
embeddings:
  base-url: ${EMBEDDINGS_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  api-key: ${GEMINI_API_KEY:}
  model: ${EMBEDDINGS_MODEL:gemini-embedding-001}
  dimensions: ${EMBEDDINGS_DIMENSIONS:768}
  timeout-seconds: ${EMBEDDINGS_TIMEOUT:60}

# --- RAG ---
rag:
  chunk-size: ${RAG_CHUNK_SIZE:1500}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:200}
  max-file-mb: ${RAG_MAX_FILE_MB:20}

# --- Documentos generados ---
docs:
  output-dir: ${DOCS_OUTPUT_DIR:generated_docs}

# --- Firma escaneada ---
# Imagen (PNG/JPG) de la firma manuscrita que se estampa, al vuelo y solo en la
# descarga, cuando el documento está APROBADO (nunca en BORRADOR). Si la ruta no
# existe o está vacía, no se estampa nada y el documento se descarga sin firma.
signature:
  image-path: ${SIGNATURE_IMAGE_PATH:}
  width-pt: ${SIGNATURE_WIDTH_PT:120}
  height-pt: ${SIGNATURE_HEIGHT_PT:60}

# --- Seguridad / JWT ---
security:
  jwt:
    secret: ${JWT_SECRET:}            # obligatorio en producción
    ttl-seconds: ${JWT_TTL:28800}     # 8 horas
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:604800}

# --- Resilience4j (circuit breaker + retry para los proveedores de IA) ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      ai-generator:
        base-config: default
      ai-verifier-citations:
        base-config: default
      ai-verifier-data:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
    instances:
      ai-generator:
        base-config: default
      ai-verifier-citations:
        base-config: default
      ai-verifier-data:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.futurotech.legal: ${LOG_LEVEL_APP:INFO}
    # Reducir ruido de frameworks; subir a DEBUG puntualmente para diagnóstico.
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
  # El traceId lo inyecta CorrelationIdFilter en el MDC (ver infra/config).
  # Se incluye entre corchetes en cada línea para rastrear una petición completa.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:futurotech-legal}] [%X{traceId:-no-trace}] [%t] %-40.40logger{39} : %m%n%wEx"
