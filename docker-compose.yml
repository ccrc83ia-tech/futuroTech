services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-legal_engine}
      POSTGRES_USER: ${DB_USER:-legal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Puerto de host 5433 para no chocar con otros PostgreSQL locales (el
      # backend se conecta por la red interna de Docker al 5432 del contenedor).
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-legal} -d ${DB_NAME:-legal_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Para GPU NVIDIA, descomentar:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Descarga el modelo de embeddings de Ollama (para el RAG) una sola vez y termina.
  # La generación de texto la hace Groq (nube), por lo que NO se descarga el
  # modelo de generación salvo que se use Ollama como proveedor (AI_PROVIDER=ollama).
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      OLLAMA_GEN_MODEL: ${OLLAMA_GEN_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando a Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Descargando modelo de embeddings: $${OLLAMA_EMBED_MODEL}"
        ollama pull "$${OLLAMA_EMBED_MODEL}"
        if [ "$${AI_PROVIDER}" = "ollama" ]; then
          echo "AI_PROVIDER=ollama: descargando modelo de generación: $${OLLAMA_GEN_MODEL}"
          ollama pull "$${OLLAMA_GEN_MODEL}"
        fi
        echo "Modelos listos."
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-legal_engine}
      DB_USER: ${DB_USER:-legal}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # IA: proveedor de generación (groq por defecto)
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Ollama: embeddings del RAG (y generación si AI_PROVIDER=ollama)
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_GEN_MODEL: ${OLLAMA_GEN_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      # Persiste los .docx generados fuera del contenedor: sin esto, al recrear
      # el backend se pierden los archivos y las descargas/vistas dan 404 aunque
      # el registro siga en la base de datos.
      - generated_docs:/app/generated_docs
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
  generated_docs:
